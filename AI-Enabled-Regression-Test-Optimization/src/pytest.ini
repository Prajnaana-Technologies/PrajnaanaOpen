[pytest]
# tests only. With `regression` here a bare `pytest` also collected
# regression/generated_tests/, so running the host suite tried to drive the
# board -- the generated modules are run deliberately, by the orchestrator,
# with an explicit target list.
testpaths = tests
norecursedirs = venv .git __pycache__ .pytest_cache

# Read by regression/catalog.py to measure the automation split and to show
# which categories have no tests at all. Registered here so an unknown
# category is a visible warning rather than a silent typo.
markers =
    category(name): functional, stress, fault_injection, long_duration, concurrency or security
