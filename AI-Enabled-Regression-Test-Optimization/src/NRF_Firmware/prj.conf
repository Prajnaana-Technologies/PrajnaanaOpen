CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# The host scans for a name containing "Zephyr" (regression/ble/ble_audio.py,
# DEVICE_NAME_MATCH). The board currently advertises Zephyr_Earbuds; keep it
# so discovery keeps working. Change both sides together if you rename it.
CONFIG_BT_DEVICE_NAME="Zephyr_Earbuds"

CONFIG_BT_MAX_CONN=1
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# ---------------------------------------------------------------------------
# Audio DSP loopback
# ---------------------------------------------------------------------------

# The compressor is float; the nRF52840 is Cortex-M4F.
CONFIG_FPU=y

# Notifications are sent from the system work queue, and float maths plus the
# BLE stack need more room than the 1024-byte default.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Throughput: the host streams 4000 bytes as about 32 writes of up to 128
# bytes, 5 ms apart, and expects the same volume notified back. The default
# buffer counts stall under that and the work handler spends its time
# retrying on -ENOMEM.
CONFIG_BT_BUF_ACL_TX_COUNT=10
# Zephyr asserts BT_BUF_EVT_RX_COUNT > BT_BUF_ACL_TX_COUNT. The default RX
# count is 10, so raising TX to 10 without this fails the build.
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10

# Let the MTU negotiate above the 23-byte default. The firmware sizes its
# notifications from the negotiated MTU (notify_chunk_size() in main.c) and
# the host sizes its writes from it independently (MAX_CHUNK in ble_audio.py),
# so a larger one means fewer packets in both directions -- up to MTU 131.
# Above that neither side grows: the host caps a write at 128 bytes and the
# firmware never notifies more than one 128-byte block.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ---------------------------------------------------------------------------
# The telemetry service (src/ble_telemetry_service.c) is compiled into this
# application and publishes the metrics the risk engine scores.
#
# The service also logs through LOG_INF. This application has CONFIG_LOG off,
# so that output is compiled out; main.c reports an init failure over printk
# instead. Enable CONFIG_LOG=y only if you need the per-sample log, and re-run
# the audio loopback tests afterwards -- it costs RAM the BLE buffers use.
# ---------------------------------------------------------------------------

# Only arms the heap fallback in sample_memory(). That branch is compiled out
# on this build, because CONFIG_HEAP_MEM_POOL_SIZE is 0 and nothing here calls
# k_malloc; it is kept so the fallback works if a heap is ever configured.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Stack high-water measurement, which is where mem_used and mem_free actually
# come from. INIT_STACKS fills stacks with 0xAA so unused space can be
# counted; THREAD_STACK_INFO stores the bounds the count needs. Without both,
# the memory fields report 0, the host treats the memory metric as unmeasured,
# and the risk engine scores it as risk rather than as health.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# ---------------------------------------------------------------------------
# Pairing and bonding
#
# Without SMP the device cannot pair at all, so a pairing test has nothing to
# exercise. With it, the telemetry service exposes an encryption-required
# characteristic (dee2) that an unpaired central cannot read -- which is what
# makes a pairing test prove an effect rather than a return code.
#
# BT_SETTINGS plus a settings backend is what makes a bond survive a reboot.
# Without persistence the pairing test would pass and the bonding test could
# not exist.
#
# Reflashing erases the NVS partition and with it every stored bond, while
# Windows keeps its side. Remove the device from Windows Bluetooth settings
# after a flash, or the next connection fails on a key mismatch.
# ---------------------------------------------------------------------------
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=2

# Let a peer pair again when it already has a bond here.
#
# Without it the board refuses: it still holds a bond from an earlier run
# while the host has forgotten its half, and Zephyr rejects the attempt as a
# re-pair. That is correct for a product and wrong for a bench, where the
# host's bond store is cleared between tests and the device's is not --
# test_pairing_grants_access failed on exactly this.
#
# It is a real weakening: a peer that copies the device address can overwrite
# an unauthenticated bond. Acceptable here because pairing is Just Works
# anyway, which provides no protection against that attacker in the first
# place. A product using authenticated pairing must leave this off.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# When a new bond completes, drop any older bond for the same peer, so the
# bond table cannot fill with stale entries for one host across many runs.
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y

CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- Battery level -------------------------------------------------------
# The standard Battery Service (0x180F / 0x2A19). read_battery() in
# regression/ble/ble_audio.py reads 0x2A19 directly, and this option is what
# publishes it: without CONFIG_BT_BAS the read fails and battery stays
# unmeasured.
CONFIG_BT_BAS=y

# SAADC, so the level reported is the measured supply rail rather than a
# constant. See boards/nrf52840dk_nrf52840.overlay.
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
